# Test configuration — overrides src/main/resources/application.properties.
# Uses an in-memory H2 database so tests (and CI) run without a live MySQL server.

spring.application.name=ecom-application-test
server.port=0

# In-memory H2 (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

project.image=images/

# JWT (test-only values)
spring.app.jwtSecret=dGVzdFNlY3JldEtleUZvckNJT25seU5vdEZvclByb2R1Y3Rpb25Vc2FnZTEyMw==
spring.app.jwtExpirationMs=3000000
spring.ecom.app.jwtCookieName=springBootEcom

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
logging.level.ecom.application=INFO
